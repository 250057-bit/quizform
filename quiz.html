<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="js/quiz.js" defer></script>
</head>
<body>
    <main>
        <form action="">
            <fieldset id="fs1">
                <legend>Pregunta 1</legend>
                <label for="inputP1">Como se llama el conjunto de reglas que hacen posible la comunicacion entre ordenadores</label>
                <input type="text" name="" id="inputP1">
                <div id="divR1">
                    <img id="imgR1" src="assets/verdad.avif" alt="Respuesta pregunta 1">
                </div>
            </fieldset>
            
            <fieldset id="fs2">
                <legend>Pregunta 2</legend>
                <label for="inputP2">Como se llama el lenguaje interpretado que tiene el nombre de una serpiente</label>
                <input type="text" name="" id="inputP2">
                <div id="divR2">
                    <img id="imgR2" src="assets/verdad.avif" alt="Respuesta pregunta 2">
                </div>
            </fieldset>

            <fieldset id="fs3">
                <legend>Pregunta 3</legend>
                <label>¿Cuál de los siguientes es un sistema operativo?</label>
                <input type="radio" name="p3" id="inputP3_1" value="HTML"> <label for="inputP3_1">HTML</label>
                <input type="radio" name="p3" id="inputP3_2" value="Linux"> <label for="inputP3_2">Linux</label>
                <input type="radio" name="p3" id="inputP3_3" value="USB"> <label for="inputP3_3">USB</label>
                <div id="divR3">
                    <img id="imgR3" src="assets/verdad.avif" alt="Respuesta pregunta 3">
                </div>
            </fieldset>

            <fieldset id="fs4">
                <legend>Pregunta 4</legend>
                <label>Selecciona los periféricos de entrada (puede haber varios):</label>
                <input type="checkbox" id="inputP4_1" value="Raton"> <label for="inputP4_1">Ratón</label>
                <input type="checkbox" id="inputP4_2" value="Monitor"> <label for="inputP4_2">Monitor</label>
                <input type="checkbox" id="inputP4_3" value="Teclado"> <label for="inputP4_3">Teclado</label>
                <div id="divR4">
                    <img id="imgR4" src="assets/verdad.avif" alt="Respuesta pregunta 4">
                </div>
            </fieldset>

            <fieldset id="fs5">
                <legend>Pregunta 5</legend>
                <label for="inputP5">¿Cuántos bits forman un byte?</label>
                <input type="number" id="inputP5">
                <div id="divR5">
                    <img id="imgR5" src="assets/verdad.avif" alt="Respuesta pregunta 5">
                </div>
            </fieldset>

            <br><button type="button" id="btnComprobar">Comprobar</button><br>
        </form>
    </main>
</body>
</html>
